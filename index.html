<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AIM</title>
<link rel="icon" type="image/png" href="aim-heart-icon.png" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800&family=Literata:ital,opsz,wght@0,18..144,400;0,18..144,500;0,18..144,600;1,18..144,400&display=swap');

  :root{
    --navy:      #0f2438;
    --navy-deep: #0a1826;
    --navy-2:    #16324f;
    --teal:      #2c9b90;
    --teal-dim:  #1f7168;
    --coral:     #ff6f52;
    --paper:     #f3e1bd;
    --paper-2:   #ecd5a4;
    --ink:       #16232c;
    --ink-soft:  #4a5a63;
    --hair:      rgba(15,36,56,0.14);
    --surface:   #ffffff;
    --green:      #1f6b46;
    --green-deep: #123d29;

    --bg: var(--paper);
    --bg-2: var(--paper-2);
    --fg: var(--ink);
    --fg-soft: var(--ink-soft);
    --card: var(--surface);
    --border: var(--hair);
    --accent: var(--teal);
    --accent-2: var(--coral);
    --nav-fg: var(--paper);
  }

  html{ scroll-behavior:smooth; }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--fg);
    font-family:'Literata', Georgia, 'Times New Roman', serif;
    font-size:17px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    padding-inline:20px;
  }
  @media (prefers-reduced-motion:reduce){ *{ animation-duration:0.01ms !important; transition-duration:0.01ms !important; } }

  h1,h2,h3, .display, .arabic{
    font-family:'Cairo', 'Segoe UI', Tahoma, sans-serif;
    text-wrap:balance;
  }
  .arabic{ direction:rtl; unicode-bidi:isolate; }

  .wrap{ max-width:1080px; margin-inline:auto; }
  .eyebrow{
    font-family:'Cairo', sans-serif;
    font-size:0.72rem;
    font-weight:700;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--accent);
  }
  .est-break{ display:none; }
  @media (max-width:560px){
    .est-break{ display:block; content:''; margin-top:2px; }
  }

  /* ---------- Nav ---------- */
  header{
    position:sticky; top:0; z-index:50;
    background:var(--bg);
    border-bottom:1px solid var(--border);
    margin-inline:-20px; padding-inline:20px;
  }

  .navrow{
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; padding-block:14px; color:var(--fg); flex-wrap:wrap;
  }
  @media (max-width:420px){
    nav.links{ gap:14px; font-size:0.78rem; }
    .navcta{ padding:8px 14px; font-size:0.76rem; }
  }
  .brandmark{ display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--fg); }
  .mark-chip{
    display:flex; align-items:center;
  }
  .mark{
    height:30px; width:auto; flex:none; display:block;
  }
  .brand-text{ display:flex; flex-direction:column; line-height:1.05; }
  .brand-text .en{ font-family:'Cairo',sans-serif; font-weight:600; font-size:0.62rem; letter-spacing:0.22em; opacity:0.6; }

  nav.links{ display:flex; gap:26px; font-family:'Cairo',sans-serif; font-size:0.86rem; font-weight:600; }
  nav.links a{
    position:relative; color:var(--fg); text-decoration:none; opacity:0.75;
    transition:opacity .15s, color .15s;
  }
  nav.links a::after{
    content:''; position:absolute; left:0; right:100%; bottom:-4px; height:2px;
    background:var(--accent); transition:right .25s ease;
  }
  nav.links a:hover, nav.links a:focus-visible{ opacity:1; color:var(--accent); }
  nav.links a:hover::after, nav.links a:focus-visible::after{ right:0; }
  .navcta{
    font-family:'Cairo',sans-serif; font-weight:700; font-size:0.82rem;
    background:var(--accent-2); color:#1c1206; padding:9px 18px; border-radius:999px;
    text-decoration:none; white-space:nowrap; transition:transform .15s, filter .15s;
  }
  .navcta:hover{ transform:translateY(-1px); filter:brightness(1.06); }

  /* ---------- Hero ---------- */
  .hero{
    padding-block:72px 56px;
    display:grid; gap:22px;
    justify-items:center;
    text-align:center;
    animation:rise .7s ease-out both;
  }
  @keyframes rise{ from{ opacity:0; transform:translateY(14px);} to{ opacity:1; transform:none; } }

  .hero-name{
    font-size:clamp(2.6rem, 7vw, 4.6rem);
    font-weight:800;
    margin:0;
    color:var(--fg);
  }
  .hero-logo{
    height:clamp(120px, 22vw, 220px);
    width:auto;
    display:block;
    margin-inline:auto;
    animation:float 5s ease-in-out infinite;
  }
  @keyframes float{
    0%, 100%{ transform:translateY(0); }
    50%{ transform:translateY(-8px); }
  }
  .hero-fullname{
    font-family:'Cairo',sans-serif; font-weight:600; letter-spacing:0.16em;
    text-transform:uppercase;
    font-size:0.8rem;
    color:var(--accent);
    margin:2px 0 0;
  }
  .hero-sub{
    font-family:'Cairo',sans-serif; font-weight:600; letter-spacing:0.02em;
    font-size:clamp(1.15rem, 2.6vw, 1.55rem);
    color:var(--fg-soft);
    margin:0;
  }
  .hero-lede{
    max-width:60ch;
    font-size:1.12rem;
    color:var(--fg-soft);
  }
  .hero-actions{ display:flex; gap:14px; flex-wrap:wrap; margin-top:4px; justify-content:center; }
  .btn{
    font-family:'Cairo',sans-serif; font-weight:700; font-size:0.92rem;
    padding:13px 26px; border-radius:999px; text-decoration:none;
    display:inline-flex; align-items:center; gap:8px;
    transition:transform .15s, filter .15s, background .15s;
  }
  .btn-primary{ background:var(--accent-2); color:#1c1206; }
  .btn-primary:hover{ transform:translateY(-2px); filter:brightness(1.05); }
  .btn-primary:active{ transform:translateY(0) scale(0.97); }
  .btn-ghost{ background:transparent; color:var(--fg); border:1.5px solid var(--border); }
  .btn-ghost:hover{ border-color:var(--accent); color:var(--accent); }
  .btn-ghost:active{ transform:scale(0.97); }

  .hero-strip{
    margin-top:18px;
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    width:100%; max-width:560px;
    padding:22px 32px;
    display:flex; align-items:center; justify-content:center; gap:14px;
    text-align:center;
    transition:transform .25s ease, box-shadow .25s ease;
  }
  .hero-strip:hover{ transform:translateY(-3px); box-shadow:0 14px 30px rgba(15,36,56,0.14); }
  .hs-num{ font-family:'Cairo',sans-serif; font-weight:800; font-size:2.8rem; color:var(--accent); font-variant-numeric:tabular-nums; line-height:1; }
  .hs-label{ font-size:0.92rem; color:var(--fg-soft); }

  /* ---------- Section shell ---------- */
  section{ padding-block:80px; border-top:1px solid var(--border); }
  .sec-head{ max-width:62ch; margin-bottom:40px; }
  .sec-head h2{ font-size:clamp(1.7rem,3.6vw,2.3rem); margin:6px 0 10px; }
  .sec-head p{ color:var(--fg-soft); margin:0; }

  /* full-bleed section backgrounds */
  .bleed{
    margin-inline:-20px; padding-inline:20px;
    border-top:none;
  }
  .bleed > .wrap{ padding-block:80px; }
  .bleed + .bleed{ padding-top:0; }
  section.bleed{ padding-block:0; }
  #about.bleed{
    background-color:var(--bg-2);
    background-image:
      linear-gradient(180deg, rgba(18,61,41,0.28) 0%, rgba(18,61,41,0) 9%),
      linear-gradient(0deg, rgba(22,50,79,0.28) 0%, rgba(22,50,79,0) 9%);
  }

  /* ---------- Impact strip ---------- */
  .impact.bleed{
    background:linear-gradient(180deg, rgba(10,24,38,0) 0%, var(--navy-2) 7%, var(--navy-deep) 93%, rgba(10,24,38,0) 100%);
    color:var(--paper);
  }
  .impact .wrap{ padding-block:60px !important; text-align:center; }
  .impact .eyebrow{ color:var(--paper); opacity:0.75; }
  .impact h2{ color:#fff; margin:6px 0 8px; font-size:clamp(1.6rem,3.4vw,2.1rem); }
  .impact p{ color:#c9d3d8; margin:0 0 30px; max-width:52ch; margin-inline:auto; }
  .impact-num{
    font-family:'Cairo',sans-serif; font-weight:800;
    font-size:clamp(3.2rem, 9vw, 5.2rem);
    color:#7fe0d3;
    line-height:1;
  }
  .impact-label{ font-family:'Cairo',sans-serif; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; font-size:0.82rem; color:#c9d3d8; margin-top:8px; }

  /* ---------- Quotes ---------- */
  .quotes.bleed{
    background:linear-gradient(180deg, var(--paper) 0%, var(--green) 55%, var(--green-deep) 100%);
    color:#fff;
  }
  .quotes .wrap{ text-align:center; }
  .quote-photo-wrap{
    width:100%; max-width:640px; aspect-ratio:4/3; border-radius:20px; overflow:hidden;
    margin:0 auto 40px; box-shadow:0 20px 50px rgba(0,0,0,0.3);
    border:3px solid rgba(255,255,255,0.2);
  }
  .quote-photo-wrap img{
    width:100%; height:100%; object-fit:cover; object-position:50% 35%;
    transition:transform .6s ease;
  }
  .quote-photo-wrap:hover img{ transform:scale(1.05); }
  .quote-mark{ font-family:Georgia,serif; font-size:4rem; line-height:1; color:rgba(255,255,255,0.4); margin-bottom:6px; }
  .quote-block{ margin-bottom:50px; }
  .quote-block:last-of-type{ margin-bottom:0; }
  .quote-ar{ font-size:1.35rem; line-height:1.9; max-width:60ch; margin:0 auto 14px; font-weight:600; }
  .quote-en{ font-size:1.02rem; line-height:1.7; max-width:56ch; margin:0 auto 16px; color:rgba(255,255,255,0.85); font-style:italic; }
  .quote-attr{ font-family:'Cairo',sans-serif; font-size:0.9rem; color:var(--paper); }
  .quote-attr .ar{ font-weight:700; letter-spacing:0.02em; }
  .quote-attr .en{ display:block; margin-top:2px; font-size:0.78rem; letter-spacing:0.08em; text-transform:uppercase; opacity:0.75; }
  .quote-divider{ width:60px; height:2px; background:rgba(255,255,255,0.3); margin:44px auto; }

  /* ---------- About / Vision / Mission ---------- */
  .lang-block{
    display:grid; grid-template-columns:1fr 1fr; gap:40px;
    padding-block:38px; border-top:1px solid var(--border);
  }
  .lang-block:first-of-type{ border-top:none; padding-top:0; }
  @media (max-width:760px){ .lang-block{ grid-template-columns:1fr; gap:18px; } }
  .reveal{ opacity:0; transform:translateY(22px); }
  .lang-col h3{
    font-size:1.15rem; margin:0 0 10px; color:var(--accent-2);
  }
  .lang-col p{ margin:0; color:var(--fg-soft); font-size:1rem; }
  .lang-col.ar h3{ text-align:right; }
  .lang-col.ar p{ text-align:right; }

  /* ---------- Get involved ---------- */
  .join{
    background:linear-gradient(160deg, var(--navy-2) 0%, var(--navy) 55%, var(--navy-deep) 100%);
    color:var(--paper);
    border-radius:22px; padding:48px clamp(24px,5vw,60px);
    text-align:center;
  }
  .join h2{ margin:0 0 10px; font-size:clamp(1.6rem,3.4vw,2.1rem); color:#fff; }
  .join p{ color:#c9d3d8; margin:0 0 20px; max-width:48ch; margin-inline:auto; }
  .join .hero-actions{ justify-content:center; }

  footer{
    padding-block:34px 50px; display:flex; justify-content:space-between; align-items:center;
    gap:14px; flex-wrap:wrap; color:var(--fg-soft); font-size:0.85rem;
  }
  footer .fmark{ display:flex; align-items:center; gap:8px; font-family:'Cairo',sans-serif; font-weight:700; color:var(--fg); }
  footer .fmark img{ height:20px; width:auto; display:block; }

  /* ---------- Apply modal ---------- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(10,24,38,0.55);
    display:flex; align-items:center; justify-content:center;
    padding:20px; z-index:200; opacity:0; pointer-events:none;
    transition:opacity .2s ease;
  }
  .modal-backdrop.open{ opacity:1; pointer-events:auto; }
  .modal{
    background:var(--card); color:var(--fg); border-radius:18px;
    width:100%; max-width:520px; max-height:88vh; overflow-y:auto;
    padding:30px clamp(20px,5vw,34px) 32px;
    transform:translateY(14px); transition:transform .2s ease;
  }
  .modal-backdrop.open .modal{ transform:translateY(0); }
  .modal-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:6px; }
  .modal-head h2{ margin:2px 0 0; font-size:1.4rem; }
  .modal-close{
    background:none; border:none; font-size:1.4rem; line-height:1; cursor:pointer;
    color:var(--fg-soft); padding:4px 8px; border-radius:8px;
  }
  .modal-close:hover{ color:var(--fg); background:var(--bg-2); }
  .modal p.modal-sub{ color:var(--fg-soft); margin:0 0 22px; font-size:0.95rem; }

  .field{ margin-bottom:16px; }
  .field label{
    display:block; font-family:'Cairo',sans-serif;
